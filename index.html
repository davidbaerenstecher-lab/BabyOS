<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getFirestore, initializeFirestore, persistentLocalCache, persistentSingleTabManager, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDL0tnuwR7qq6GNqUk0qkeudGkC_aUcaRM",
  authDomain: "babyos-ed99c.firebaseapp.com",
  projectId: "babyos-ed99c",
  storageBucket: "babyos-ed99c.firebasestorage.app",
  messagingSenderId: "240011309463",
  appId: "1:240011309463:web:a8b8b768df2e494c4d54d2",
  measurementId: "G-CWSXTCXNZN"
};

const firebaseApp = initializeApp(firebaseConfig);
let db;
try{
  // Persists events locally (IndexedDB) so reloads show the last-synced
  // state instantly instead of blocking on a fresh network round-trip.
  db = initializeFirestore(firebaseApp, {
    localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() })
  });
}catch(e){
  db = getFirestore(firebaseApp);
}
const eventsDocRef = doc(db, "cozylog", "shared");

const state = {
  screen: 'loading', // loading | home | log
  events: [],
  meds: [], // saved medications: {id, name, unit, amount, note}
  activities: [], // saved activity types: {id, name}
  viewDate: startOfDay(new Date()),
  modal: null, // 'feed' | 'diaper' | 'activity'
  editingId: null,
  feedAmount: '',
  feedUnit: 'ml',
  diaperType: 'dirty',
  note: '',
  entryBaseDate: null, // ms timestamp at midnight of the entry's date
  entryHour: '12',
  entryMinute: '00',
  entryAmPm: 'AM',
  medsScreen: null, // null | 'select' | 'add'
  selectedMedIds: [],
  editingMedId: null, // set when the add/edit screen is editing an existing saved med
  newMedName: '',
  newMedUnit: 'mL',
  newMedAmount: '',
  newMedNote: '',
  activityScreen: null, // null | 'select' | 'add'
  selectedActivityId: null,
  editingActivityTypeId: null, // set when the add/edit screen is editing an existing saved activity type
  newActivityName: '',
  activityDuration: '',
  activityMode: 'manual', // 'manual' | 'timer'
  timerRunning: false,
  timerStartedAt: null, // ms epoch when the running timer started
  timerElapsedMs: 0, // finalized elapsed time once stopped
  timerIntervalId: null,
  toast: null,
  toastTimer: null,
};

function startOfDay(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
function sameDay(a,b){ return startOfDay(a).getTime() === startOfDay(b).getTime(); }
function diaperLabel(t){
  if(t==='wet') return 'Pee';
  if(t==='dirty') return 'Poo';
  if(t==='diarrhea') return 'Diarrhea';
  return 'Pee & Poo';
}
function fmtTime(ts){ return new Date(ts).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); }
function fmtDayLabel(d){
  const today = startOfDay(new Date());
  if(sameDay(d, today)) return 'Today';
  const yest = new Date(today); yest.setDate(yest.getDate()-1);
  if(sameDay(d, yest)) return 'Yesterday';
  const tom = new Date(today); tom.setDate(tom.getDate()+1);
  if(sameDay(d, tom)) return 'Tomorrow';
  return d.toLocaleDateString([], {weekday:'long', month:'short', day:'numeric'});
}
function fmtDaySub(d){ return d.toLocaleDateString([], {year:'numeric', month:'long', day:'numeric'}); }

function toDateInputValue(ms){
  const d = new Date(ms);
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseDateInputValue(v){
  const [y,m,day] = v.split('-').map(Number);
  return new Date(y, m-1, day);
}

function setEntryTimeFromDate(d){
  state.entryBaseDate = startOfDay(d).getTime();
  let h = d.getHours();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if(h === 0) h = 12;
  state.entryHour = String(h);
  state.entryMinute = String(d.getMinutes()).padStart(2,'0');
  state.entryAmPm = ampm;
}

function computeEntryTimestamp(){
  const base = new Date(state.entryBaseDate !== null ? state.entryBaseDate : startOfDay(new Date()));
  let h = parseInt(state.entryHour, 10);
  let m = parseInt(state.entryMinute, 10);
  if(isNaN(h) || h < 1) h = 12;
  if(h > 12) h = 12;
  if(isNaN(m) || m < 0) m = 0;
  if(m > 59) m = 59;
  if(state.entryAmPm === 'PM' && h !== 12) h += 12;
  if(state.entryAmPm === 'AM' && h === 12) h = 0;
  base.setHours(h, m, 0, 0);
  return base.getTime();
}

let unsubscribeEvents = null;
const TIMER_STORAGE_KEY = 'cozylog_activeTimer';

function persistActiveTimer(){
  try{ localStorage.setItem(TIMER_STORAGE_KEY, JSON.stringify({ startedAt: state.timerStartedAt, activityId: state.selectedActivityId })); }
  catch(e){}
}

function clearPersistedTimer(){
  try{ localStorage.removeItem(TIMER_STORAGE_KEY); }
  catch(e){}
}

function resumeActiveTimerIfAny(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(TIMER_STORAGE_KEY)); }catch(e){}
  if(!saved || !saved.startedAt) return;
  state.modal = 'activity';
  state.editingId = null;
  state.selectedActivityId = saved.activityId || null;
  state.activityMode = 'timer';
  state.timerRunning = true;
  state.timerStartedAt = saved.startedAt;
  setEntryTimeFromDate(new Date(saved.startedAt));
  state.timerIntervalId = setInterval(()=>{
    const displayEl = document.getElementById('timer-display');
    if(displayEl) displayEl.textContent = formatElapsed(Date.now() - state.timerStartedAt);
  }, 1000);
}

function startListeningForEvents(){
  unsubscribeEvents = onSnapshot(eventsDocRef, (snap)=>{
    const data = snap.exists() ? snap.data() : null;
    state.events = (data && Array.isArray(data.events)) ? data.events : [];
    state.meds = (data && Array.isArray(data.meds)) ? data.meds : [];
    state.activities = (data && Array.isArray(data.activities)) ? data.activities : [];
    if(state.screen === 'loading'){
      state.screen = 'home';
      resumeActiveTimerIfAny();
    }
    render();
  }, (err)=>{
    console.error('Firestore listen failed', err);
    if(state.screen === 'loading'){
      state.screen = 'home';
      resumeActiveTimerIfAny();
    }
    showToast('Could not connect — check your internet connection');
    render();
  });
}

async function saveEvents(){
  await setDoc(eventsDocRef, { events: state.events, meds: state.meds, activities: state.activities });
}

function csvEscape(val){
  const s = String(val === undefined || val === null ? '' : val);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function exportCSV(){
  if(state.events.length === 0){
    showToast('No entries to export yet');
    return;
  }
  const rows = [['Date', 'Time', 'Type', 'Amount', 'Unit', 'Diaper Type', 'Activity', 'Duration (min)', 'Note']];
  const sorted = [...state.events].sort((a,b)=>a.timestamp-b.timestamp);
  sorted.forEach(ev=>{
    const d = new Date(ev.timestamp);
    const dateStr = d.toLocaleDateString('en-CA');
    const timeStr = fmtTime(ev.timestamp);
    if(ev.type === 'feed'){
      rows.push([dateStr, timeStr, 'Feeding', ev.amount, ev.unit, '', '', '', ev.note || '']);
    } else if(ev.type === 'diaper'){
      rows.push([dateStr, timeStr, 'Diaper', '', '', diaperLabel(ev.diaperType), '', '', ev.note || '']);
    } else if(ev.type === 'activity'){
      rows.push([dateStr, timeStr, 'Activity', '', '', '', ev.activityName || '', ev.durationMinutes, ev.note || '']);
    }
  });
  const csv = rows.map(r => r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `cozylog-export-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function showToast(msg, undoFn){

  render();
  clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(()=>{ state.toast = null; render(); }, 4000);

async function init(){

}

function resetActivityTimer(){
  if(state.timerIntervalId){ clearInterval(state.timerIntervalId); state.timerIntervalId = null; }
  state.timerRunning = false;
  state.timerStartedAt = null;
  state.timerElapsedMs = 0;
  clearPersistedTimer();
}

function resetActivityFields(){
  state.activityScreen = null;
  state.selectedActivityId = null;
  state.editingActivityTypeId = null;
  state.activityDuration = '';
  state.activityMode = 'manual';
  resetActivityTimer();
}

function closeModal(){
  state.modal = null;
  state.editingId = null;
  state.feedAmount = '';
  state.note = '';
  state.medsScreen = null;
  state.selectedMedIds = [];
  state.editingMedId = null;

}

function openNewEntry(type){

  state.modal = type;
  state.feedAmount = '';
  state.note = '';

  state.selectedMedIds = [];

  }

function openEditEntry(ev){
  state.editingId = ev.id;
  state.note = ev.note || '';
  state.medsScreen = null;
  resetActivityFields();
  if(ev.type === 'feed'){
    state.modal = 'feed';
    state.feedAmount = String(ev.amount);
    state.feedUnit = ev.unit;
    state.selectedMedIds = (ev.meds || []).map(m=>m.id);
  } else if(ev.type === 'diaper'){
    state.modal = 'diaper';
    state.diaperType = ev.diaperType;
    state.selectedMedIds = [];
  } else if(ev.type === 'activity'){
    state.modal = 'activity';
    state.selectedActivityId = ev.activityId || null;
    state.activityDuration = ev.durationMinutes != null ? String(ev.durationMinutes) : '';
    state.selectedMedIds = [];

function toggleMedSelected(id){

function openAddMed(){

function cancelAddMed(){

async function saveNewMed(){
  const name = state.newMedName.trim();
  if(!name || !state.newMedUnit) return;
  const amtVal = parseFloat(state.newMedAmount);
  const amount = (state.newMedAmount.trim() && !isNaN(amtVal) && amtVal > 0) ? amtVal : null;
  const note = state.newMedNote.trim();
  if(state.editingMedId){
    const idx = state.meds.findIndex(m=>m.id===state.editingMedId);
    if(idx !== -1){
      state.meds[idx] = { ...state.meds[idx], name, unit: state.newMedUnit, amount, note };
    }
  } else {
    const med = { id:'m'+Date.now()+Math.random().toString(36).slice(2,7), name, unit: state.newMedUnit, amount, note };
    state.meds.push(med);
    state.selectedMedIds.push(med.id);
  }
  state.medsScreen = 'select';
  state.editingMedId = null;
  render();
  try{ await saveEvents(); }
  catch(e){ showToast('Could not save — check connection'); }
}

async function deleteMed(){

  const id = state.editingMedId;
  state.meds = state.meds.filter(m=>m.id!==id);
  state.selectedMedIds = state.selectedMedIds.filter(mid=>mid!==id);
  state.medsScreen = 'select';
  state.editingMedId = null;
  render();
  try{ await saveEvents(); }
  catch(e){ showToast('Could not save — check connection'); }
}

function formatElapsed(ms){
  const totalSec = Math.floor(ms / 1000);
  const mm = Math.floor(totalSec / 60);
  const ss = totalSec % 60;
  return `${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
}

function startTimer(){
  state.timerElapsedMs = 0;
  state.timerRunning = true;
  state.timerStartedAt = Date.now();
  persistActiveTimer();
  state.timerIntervalId = setInterval(()=>{
    const displayEl = document.getElementById('timer-display');
    if(displayEl) displayEl.textContent = formatElapsed(Date.now() - state.timerStartedAt);
  }, 1000);
  render();
}

function stopTimer(){
  if(state.timerIntervalId){ clearInterval(state.timerIntervalId); state.timerIntervalId = null; }
  const elapsed = Date.now() - state.timerStartedAt;
  state.timerElapsedMs = elapsed;
  state.timerRunning = false;
  state.timerStartedAt = null;
  state.activityDuration = String(Math.round((elapsed / 60000) * 100) / 100);
  clearPersistedTimer();
  render();
}

async function deleteEditingEntry(){
  if(!state.editingId) return;
  if(!window.confirm('Delete this entry? This can\'t be undone.')) return;
  const id = state.editingId;
  state.events = state.events.filter(e=>e.id!==id);
  closeModal();
  try{ await saveEvents(); showToast('Entry deleted'); }
  catch(e){ showToast('Could not save — check connection'); }
}

async function logDiaper(type){
  const ts = computeEntryTimestamp();
  if(state.editingId){
    const idx = state.events.findIndex(e=>e.id===state.editingId);
    if(idx === -1) return;
    state.events[idx] = {...state.events[idx], diaperType: type, note: state.note.trim(), timestamp: ts};
    closeModal();
    try{ await saveEvents(); showToast('Entry updated'); }
    catch(e){ showToast('Could not save — check connection'); }
    return;
  }
  const ev = { id: 'e'+Date.now()+Math.random().toString(36).slice(2,7), type:'diaper', diaperType: type, timestamp: ts, note: state.note.trim() };
  state.events.push(ev);
  state.note = '';
  state.modal = null;
  render();
  try{
    await saveEvents();
    showToast(`Logged ${diaperLabel(type)} at ${fmtTime(ev.timestamp)}`, async ()=>{
      state.events = state.events.filter(e=>e.id!==ev.id);
      render();
      await saveEvents();
    });
  }catch(e){ showToast('Could not save — check connection'); }
}

async function logFeed(){
  const amt = parseFloat(state.feedAmount);
  if(!amt || amt <= 0) return;
  const ts = computeEntryTimestamp();
  const selectedMeds = state.meds.filter(m => state.selectedMedIds.includes(m.id));
  if(state.editingId){
    const idx = state.events.findIndex(e=>e.id===state.editingId);
    if(idx === -1) return;
    state.events[idx] = {...state.events[idx], amount: amt, unit: state.feedUnit, note: state.note.trim(), timestamp: ts, meds: selectedMeds};
    closeModal();
    try{ await saveEvents(); showToast('Entry updated'); }
    catch(e){ showToast('Could not save — check connection'); }
    return;
  }
  const ev = { id:'e'+Date.now()+Math.random().toString(36).slice(2,7), type:'feed', amount: amt, unit: state.feedUnit, timestamp: ts, note: state.note.trim(), meds: selectedMeds };
  state.events.push(ev);
  state.feedAmount = '';
  state.note = '';
  state.modal = null;
  render();
  try{
    await saveEvents();
    showToast(`Logged ${amt}${state.feedUnit} feed at ${fmtTime(ev.timestamp)}`, async ()=>{
      state.events = state.events.filter(e=>e.id!==ev.id);
      render();
      await saveEvents();
    });
  }catch(e){ showToast('Could not save — check connection'); }
}

async function logActivity(){
  try{
    if(!state.selectedActivityId){
      showToast('Select an activity type first');
      return;
    }
    const dur = parseFloat(state.activityDuration);
    if(!dur || dur <= 0){
      showToast(state.activityMode === 'timer' ? 'Start and stop the timer first' : 'Enter a duration');
      return;
    }
    const act = state.activities.find(a=>a.id===state.selectedActivityId);
    const ts = computeEntryTimestamp();
    if(state.editingId){
      const idx = state.events.findIndex(e=>e.id===state.editingId);
      if(idx === -1){
        showToast('Could not find this entry to update');
        return;
      }
      state.events[idx] = {...state.events[idx], activityId: state.selectedActivityId, activityName: act ? act.name : state.events[idx].activityName, durationMinutes: dur, note: state.note.trim(), timestamp: ts};
      closeModal();
      try{ await saveEvents(); showToast('Entry updated'); }
      catch(e){ showToast('Could not save — check connection'); }
      return;
    }
    const ev = { id:'e'+Date.now()+Math.random().toString(36).slice(2,7), type:'activity', activityId: state.selectedActivityId, activityName: act ? act.name : '', durationMinutes: dur, timestamp: ts, note: state.note.trim() };
    state.events.push(ev);
    resetActivityFields();
    state.note = '';
    state.modal = null;
    render();
    try{
      await saveEvents();
      showToast(`Logged ${ev.activityName} — ${dur} min`, async ()=>{
        state.events = state.events.filter(e=>e.id!==ev.id);
        render();
        await saveEvents();
      });
    }catch(e){ showToast('Could not save — check connection'); }
  }catch(err){
    console.error('logActivity failed', err);
    showToast('Error: ' + (err && err.message ? err.message : String(err)));
  }
}

function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k === 'class') e.className = v;
    else if(k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if(k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c === null || c === undefined) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
}

function medLabel(m){
  return m.amount ? `${m.name} · ${m.amount}${m.unit}` : `${m.name} · ${m.unit}`;
}

function unitLabel(unit, amount){
  if(unit === 'drops') return amount === 1 ? 'drop' : 'drops';
  return unit;
}

function medsSummaryLabel(feedEvents){
  const counts = {};
  feedEvents.forEach(ev=>{
    (ev.meds || []).forEach(m=>{
      if(!counts[m.id]) counts[m.id] = { name: m.name, unit: m.unit, totalAmount: 0, hasAmount: false, count: 0 };
      counts[m.id].count++;
      if(m.amount){
        counts[m.id].totalAmount += m.amount;
        counts[m.id].hasAmount = true;
      }
    });
  });
  const parts = Object.values(counts).map(m=>{
    if(m.hasAmount){
      const amt = Math.round(m.totalAmount * 100) / 100;
      return `${m.name}: ${amt} ${unitLabel(m.unit, amt)}`;
    }
    return m.count > 1 ? `${m.name} ×${m.count}` : m.name;
  });
  return parts.length ? `💊 ${parts.join(', ')}` : '';
}

function eventDotColor(ev){
  if(ev.type === 'feed') return 'var(--feed)';
  if(ev.type === 'diaper') return 'var(--diaper)';
  return 'var(--activity)';
}
function eventIcoClass(ev){
  if(ev.type === 'feed') return 'feed';
  if(ev.type === 'diaper') return 'diaper';
  return 'activity';
}
function eventIcon(ev){
  if(ev.type === 'feed') return '🍼';
  if(ev.type === 'diaper') return '💩';
  return '🤸';
}
function eventLabel(ev){
  if(ev.type === 'feed') return `Feeding — ${ev.amount}${ev.unit}`;
  if(ev.type === 'diaper') return `Diaper — ${diaperLabel(ev.diaperType)}`;
  return `${ev.activityName || 'Activity'} — ${ev.durationMinutes} min`;
}

function activitiesSummaryLabel(activityEvents){
  const totals = {};
  activityEvents.forEach(ev=>{
    const key = ev.activityId || ev.activityName;
    if(!totals[key]) totals[key] = { name: ev.activityName || 'Activity', totalMinutes: 0 };
    totals[key].totalMinutes += (ev.durationMinutes || 0);
  });
  const parts = Object.values(totals).map(a => `${a.name}: ${Math.round(a.totalMinutes * 100) / 100} min`);
  return parts.length ? `🤸 ${parts.join(', ')}` : '';
}

function recentEvents(){
  return [...state.events].sort((a,b)=>b.timestamp-a.timestamp).slice(0,4);
}

  hourInput.addEventListener('blur', (e)=>{
    let h = parseInt(e.target.value, 10);

    if(h > 12) h = 12;

function renderActivityTypeField(){
  const selectedAct = state.activities.find(a=>a.id===state.selectedActivityId);
  return el('button', {class:'select-field', type:'button', onclick: openActivitySelect}, [
    el('span', {class: selectedAct ? '' : 'placeholder'}, selectedAct ? selectedAct.name : 'Select activity type'),
    el('span', {class:'chev'}, '›')
  ]);
}

function renderActivityTimer(){
  const wrap = el('div', {style:'text-align:center; margin-top:10px;'});
  const currentElapsed = state.timerRunning ? (Date.now() - state.timerStartedAt) : state.timerElapsedMs;
  wrap.appendChild(el('div', {id:'timer-display', style:'font-size:36px; font-weight:700; font-variant-numeric:tabular-nums; margin-bottom:14px;'}, formatElapsed(currentElapsed)));
  wrap.appendChild(el('button', {
    type:'button',
    class: 'timer-btn' + (state.timerRunning ? ' running' : ''),
    onclick: state.timerRunning ? stopTimer : startTimer
  }, state.timerRunning ? 'Stop' : 'Start'));
  return wrap;
}

function renderActivityDurationSection(){
  const wrap = el('div', {});
  wrap.appendChild(el('div', {class:'field-label'}, 'Duration'));

  const modeRow = el('div', {class:'chip-row'});
  [['manual','✏️ Manual'], ['timer','⏱️ Timer']].forEach(([val,label])=>{
    modeRow.appendChild(el('button', {
      class: 'chip' + (state.activityMode===val ? ' active' : ''),
      type:'button',
      onclick: ()=>{
        if(val === 'manual' && state.timerRunning) stopTimer();
        state.activityMode = val;
        render();
      }
    }, label));
  });
  wrap.appendChild(modeRow);

  if(state.activityMode === 'timer'){
    wrap.appendChild(renderActivityTimer());
  } else {
    const durationInput = el('input', {class:'amount-input', style:'font-size:28px; margin-top:10px;', type:'number', inputmode:'decimal', placeholder:'0', value: state.activityDuration});
    durationInput.addEventListener('input', (e)=>{ state.activityDuration = e.target.value; });
    wrap.appendChild(el('div', {class:'amount-row', style:'margin-top:10px;'}, [durationInput, el('div', {style:'color:var(--ink-soft); font-weight:600; font-size:15px;'}, 'min')]));
  }
  return wrap;
}

function renderToast(){
  const t = el('div', {class:'toast'}, [el('span', {}, state.toast.msg)]);
  if(state.toast.undoFn){
    t.appendChild(el('button', {onclick: async ()=>{ await state.toast.undoFn(); state.toast=null; render(); }}, 'UNDO'));
  }
  return t;
}

function renderLog(root){
  const header = el('header', {}, [
    el('div', {class:'brand'}, ['Cozy', el('span', {}, 'Log')])
  ]);
  root.appendChild(header);

  const main = el('main');
  main.appendChild(el('div', {class:'back-row'}, [
    el('button', {class:'back-btn', onclick: ()=>{ state.screen='home'; render(); }}, '‹ Home')
  ]));

  const dayEvents = state.events
    .filter(ev => sameDay(new Date(ev.timestamp), state.viewDate))
    .sort((a,b)=>b.timestamp-a.timestamp);

  const feedEvents = dayEvents.filter(ev => ev.type === 'feed');
  const feedCount = feedEvents.length;
  const totalMl = Math.round(feedEvents.reduce((sum, ev) => {
    const ml = ev.unit === 'ml' ? ev.amount : ev.amount * 29.5735;
    return sum + ml;
  }, 0));

  const activityEvents = dayEvents.filter(ev => ev.type === 'activity');
  const medsSummary = medsSummaryLabel(feedEvents);
  const activitiesSummary = activitiesSummaryLabel(activityEvents);
  const navInfo = [
    el('div', {class:'day-label'}, fmtDayLabel(state.viewDate)),
    el('div', {class:'day-sub'}, fmtDaySub(state.viewDate)),
    el('div', {class:'day-stats'}, `${feedCount} feeding${feedCount===1?'':'s'} · ${totalMl} mL total`)
  ];
  if(medsSummary) navInfo.push(el('div', {class:'day-meds'}, medsSummary));
  if(activitiesSummary) navInfo.push(el('div', {class:'day-meds'}, activitiesSummary));

  const nav = el('div', {class:'day-nav'}, [
    el('button', {onclick: ()=>{ state.viewDate = new Date(state.viewDate.getTime() - 86400000); render(); }}, '‹'),
    el('div', {}, navInfo),
    el('button', {onclick: ()=>{ state.viewDate = new Date(state.viewDate.getTime() + 86400000); render(); }}, '›')
  ]);
  main.appendChild(nav);

  if(dayEvents.length === 0){
    main.appendChild(el('div', {class:'day-empty'}, 'No events logged for this day.'));
  } else {
    const timeline = el('div', {class:'timeline'});
    dayEvents.forEach(ev=>{
      const card = el('div', {class:'event-card', onclick: ()=>openEditEntry(ev)}, [
        el('div', {class:'ico ' + eventIcoClass(ev)}, eventIcon(ev)),
        el('div', {class:'details'}, [
          el('div', {class:'title'}, eventLabel(ev)),
          el('div', {class:'desc'}, ev.note ? ev.note : '')
        ]),
        el('div', {class:'time'}, fmtTime(ev.timestamp))
      ]);
      timeline.appendChild(card);
    });
    main.appendChild(timeline);
  }
  main.appendChild(el('button', {class:'export-btn', onclick: exportCSV}, '⬇ Export all entries as CSV'));
  root.appendChild(main);
  if(state.modal === 'feed') root.appendChild(renderFeedModal());
  if(state.modal === 'diaper') root.appendChild(renderDiaperModal());
  if(state.modal === 'activity') root.appendChild(renderActivityModal());
  if(state.medsScreen === 'select') root.appendChild(renderMedsSelectOverlay());
  if(state.medsScreen === 'add') root.appendChild(renderMedsAddOverlay());
  if(state.activityScreen === 'select') root.appendChild(renderActivitySelectOverlay());
  if(state.activityScreen === 'add') root.appendChild(renderActivityAddOverlay());
  if(state.toast) root.appendChild(renderToast());
}

function render(){
  const root = document.getElementById('app');
  root.innerHTML = '';
  if(state.screen === 'loading'){
    root.appendChild(el('div', {class:'loading'}, 'Loading CozyLog…'));
    return;
  }
  if(state.screen === 'home') return renderHome(root);
  if(state.screen === 'log') return renderLog(root);
}

init();
</script>
